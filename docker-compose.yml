version: "3.8"

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/2181' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9092' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  create-topics:
    build: .
    command: python -m scripts.create_topics
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  producer-linhas:
    build: .
    command: python -m producer.producer_linhas
    env_file: .env
    depends_on:
      kafka:
        condition: service_healthy
      create-topics:
        condition: service_completed_successfully
    restart: on-failure

  producer-paradas:
    build: .
    command: python -m producer.producer_paradas
    env_file: .env
    depends_on:
      kafka:
        condition: service_healthy
      create-topics:
        condition: service_completed_successfully
    restart: on-failure

  producer-posicoes:
    build: .
    command: python -m producer.producer_posicoes
    env_file: .env
    depends_on:
      kafka:
        condition: service_healthy
      create-topics:
        condition: service_completed_successfully
    restart: on-failure

  producer-previsoes:
    build: .
    command: python -m producer.producer_previsao
    env_file: .env
    depends_on:
      kafka:
        condition: service_healthy
      create-topics:
        condition: service_completed_successfully
    restart: on-failure

  producer-corredores:
    build: .
    command: python -m producer.producer_corredores
    env_file: .env
    depends_on:
      kafka:
        condition: service_healthy
      create-topics:
        condition: service_completed_successfully
    restart: on-failure

  producer-velocidade:
    build: .
    command: python -m producer.producer_velocidade
    env_file: .env
    depends_on:
      kafka:
        condition: service_healthy
      create-topics:
        condition: service_completed_successfully
    restart: on-failure

  consumer-s3:
    build: .
    command: python -m consumer.consumer_s3
    env_file: .env
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure
